<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รวม mockup · AGA Bait Registry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1c2b3a;--muted:#5b6b7c;--line:#dde3ea;--accent:#1f5fa8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#16212d;--fg:#e6edf3;--muted:#9fb0c0;--line:#2a3a4a;--accent:#4a90d9}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans Thai',sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:auto}
h1{font-size:22px;margin:0}header p{color:var(--muted);margin:6px 0 0}
main{max-width:1200px;margin:auto;padding:8px 16px 40px}
h2{font-size:15px;color:var(--muted);margin:22px 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
.thumb{height:170px;overflow:hidden;position:relative;border-bottom:1px solid var(--line);background:var(--bg)}
.thumb iframe{width:1280px;height:850px;border:0;transform:scale(.2);transform-origin:0 0;pointer-events:none}
.t{padding:10px 12px}.t b{display:block;font-size:14px}.t span{font-size:12px;color:var(--muted)}

/* ===== UX เร่งด่วน (เจ้าของอนุมัติ 16 พ.ย. 2026 · HQ วัดค่าจริง) =====
   1) ไอคอนเส้น .ixs แทนอีโมจิ/สัญลักษณ์ในปุ่ม (ขนาดตามตัวอักษร สี currentColor)
   2) จอ ≤767px: ช่องกรอก 16px (iPhone ไม่ซูมเอง) · ปุ่ม/ตัวควบคุมสูง ≥44px · จอคอมคงเดิม
   ใช้ !important เฉพาะ font-size ช่องกรอก เพราะแต่ละหน้ามี selector เฉพาะที่ specificity สูงกว่า */
small{font-size:max(12px,.85em)} /* <small> ของเบราว์เซอร์ย่อเหลือ ~10.8px · ขั้นต่ำ 12px */
.ixs{width:1em;height:1em;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (max-width:767px){
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=hidden]):not([type=color]),select,textarea{font-size:16px !important}
  button,.btn,a.btn,select,summary,.navtoggle,.addbtn,.savebtn,.theme-btn,.nav a,.seg button,button.chip,a.chip,.chip[role=button]{min-height:44px !important}
  .chip[role=button]{display:inline-flex;align-items:center}
  .navtoggle{min-width:44px}
}
</style></head><body>
<header><h1>รวม mockup ทุกหน้า — AGA Bait Registry</h1><p>กดการ์ดเพื่อเปิดหน้าเต็ม · ภาพย่อเป็นหน้าจริงจากไฟล์ใน <code>docs/mockup/</code></p></header>
<main id="m"></main>
<script>
const base='';
const groups=[
 ['งานประจำวัน',[
  ['aga-bait-registry-prototype.html#todo','สถานะทะเบียนบริการ','#todo'],
  ['aga-bait-registry-prototype.html#service','ลงข้อมูลทำบริการประจำเดือน','#service'],
  ['aga-bait-registry-prototype.html#bait','กล่อง AG นอกรอบประจำเดือน','#bait'],
  ['aga-bait-registry-prototype.html#collect','ลูกค้ารอเก็บสถานี','#collect']]],
 ['ทะเบียนและสรุป',[
  ['aga-bait-registry-prototype.html#registry','ทะเบียนลูกค้า/สัญญา','#registry'],
  ['customer-detail.html','รายละเอียดลูกค้า','customer-detail.html'],
  ['admin-add-customer.html','เปิดงานเข้าทะเบียนบริการ','admin-add-customer.html'],
  ['aga-bait-registry-prototype.html#material','สรุปงานบริการรายเดือน','#material'],
  ['aga-bait-registry-prototype.html#summary','Dashboard สรุปมูลค่าทั้งหมด','#summary']]],
 ['ดูแลระบบ',[
  ['month-closure.html','ส่งข้อมูล และสรุปงานประจำเดือน','month-closure.html'],
  ['provincial-port-update.html','ลงข้อมูล Port ต่างจังหวัด','provincial-port-update.html'],
  ['dashboard-sync.html','Dashboard Sync','dashboard-sync.html'],
  ['history-log.html','ประวัติการแก้ไข','history-log.html'],
  ['admin-user-management.html','จัดการผู้ใช้','admin-user-management.html'],
  ['settings.html','ตั้งค่า','settings.html'],
  ['login.html','เข้าสู่ระบบ','login.html'],
  ['tutorial.html','บทเรียนเริ่มใช้งานครั้งแรก (E1)','tutorial.html']]]
];
const m=document.getElementById('m');
for(const [g,items] of groups){
 m.insertAdjacentHTML('beforeend',`<h2>${g}</h2>`);
 const grid=document.createElement('div');grid.className='grid';
 for(const [f,name,sub] of items){
  grid.insertAdjacentHTML('beforeend',`<a class="card" href="${base+f}"><div class="thumb"><iframe loading="lazy" src="${base+f}" tabindex="-1"></iframe></div><div class="t"><b>${name}</b><span>${sub}</span></div></a>`);
 }
 m.appendChild(grid);
}
</script></body></html>
